name: Build iOS (unsigned IPA)

# Запуск вручную: вкладка Actions -> "Build iOS (unsigned IPA)" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare logs dir
        run: mkdir -p logs

      - name: Install JS dependencies
        run: |
          set -o pipefail
          (npm ci 2>&1 | tee logs/npm.log) || (npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee -a logs/npm.log)

      # Необязательно: секрет GOOGLE_MAPS_API_KEY (Settings -> Secrets and variables -> Actions)
      # подставляется в app.json и src/config.js во время сборки
      - name: Inject Google Maps key from secret (optional)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
          node <<'JS'
          const fs = require('fs');
          const key = process.env.GOOGLE_MAPS_API_KEY;
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const plugins = (app.expo.plugins = app.expo.plugins || []);
          const idx = plugins.findIndex((p) => (Array.isArray(p) ? p[0] : p) === 'react-native-maps');
          const prev = idx >= 0 && Array.isArray(plugins[idx]) ? plugins[idx][1] : {};
          const entry = ['react-native-maps', { ...prev, iosGoogleMapsApiKey: key, androidGoogleMapsApiKey: key }];
          if (idx >= 0) plugins[idx] = entry; else plugins.push(entry);
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          const cfg = fs.readFileSync('src/config.js', 'utf8')
            .replace(/GOOGLE_API_KEY\s*=\s*'[^']*'/, "GOOGLE_API_KEY = '" + key + "'");
          fs.writeFileSync('src/config.js', cfg);
          JS
          fi

      - name: Generate native iOS project (prebuild)
        run: |
          set -o pipefail
          npx expo prebuild --platform ios --clean 2>&1 | tee logs/prebuild.log

      - name: Build app (Release, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee ../logs/xcodebuild.log

      - name: Package IPA
        working-directory: ios
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry uklon-clone-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: uklon-clone-ios-unsigned
          path: ios/uklon-clone-unsigned.ipa
          retention-days: 14

      # --- Диагностика при падении ---
      - name: Show error summary (on failure)
        if: failure()
        run: |
          for f in logs/*.log; do
            echo "=================== $f (last 60 lines) ==================="
            tail -n 60 "$f"
          done
          echo "=================== lines with 'error' ==================="
          grep -hiE "error:|npm ERR!|CocoaPods|\[!\]" logs/*.log | head -n 40 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7